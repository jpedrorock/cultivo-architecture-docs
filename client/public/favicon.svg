<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle - green -->
  <circle cx="50" cy="50" r="50" fill="#10b981"/>

  <!-- Sprout icon (lucide Sprout) centered and scaled -->
  <!-- Original lucide viewBox: 0 0 24 24, centered at 12,12 -->
  <!-- Translate to center 50,50 and scale to fit nicely -->
  <g transform="translate(50,54) scale(2.6)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M0 3 C0 3 0 -2 0 -8"/>
    <!-- left leaf -->
    <path d="M0 -4 C-2 -7 -6 -8 -8 -6 C-8 -2 -4 0 0 -4Z"/>
    <!-- right leaf -->
    <path d="M0 -7 C2 -10 6 -11 8 -9 C8 -5 4 -3 0 -7Z"/>
  </g>
</svg>
